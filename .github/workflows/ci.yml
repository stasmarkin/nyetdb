name: CI

on:
  push:
    branches: [main]
  pull_request:

# Security tool: least privilege for the workflow token (Д8).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# All actions are pinned to full commit SHAs (supply chain, Д8).
jobs:
  check:
    runs-on: ubuntu-latest
    # Safety net against a hung job (e.g. a wedged container/tunnel test).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # ubuntu-latest ships a running Docker daemon, so the testcontainers
      # PostgreSQL tests (src/engine.rs, tests/postgres.rs) run for real —
      # testcontainers pulls postgres:16-alpine over the runner's network.
      - run: cargo test

  # Supply chain gates (Д8): licenses/bans/advisories + RustSec audit.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
        with:
          toolchain: stable
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit
      - run: cargo audit
