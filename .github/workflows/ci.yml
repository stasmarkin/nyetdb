name: CI

on:
  push:
    branches: [main]
  pull_request:

# Security tool: least privilege for the workflow token (D8).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# All actions are pinned to full commit SHAs (supply chain, D8).
jobs:
  check:
    runs-on: ubuntu-latest
    # Safety net against a hung job (e.g. a wedged container/tunnel test).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # ubuntu-latest ships a running Docker daemon, so the testcontainers
      # PostgreSQL tests (src/engine.rs, tests/postgres.rs) run for real —
      # testcontainers pulls postgres:16-alpine over the runner's network.
      - run: cargo test

  # MSRV gate: the rust-version in Cargo.toml must actually build. cargo check,
  # not test — MSRV is about building from source, not running tests (a full test
  # run also needs Docker for testcontainers). --all-targets works here because
  # every dev-dep's own MSRV (max: testcontainers 1.88) is below the package's.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets

  # Supply chain gates (D8): licenses/bans/advisories + RustSec audit.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit

  # Cheap static linters, all as prebuilt binaries (no compile): spelling
  # (typos, config in _typos.toml), unused dependencies (cargo-shear), and
  # workflow security (zizmor, config in .github/zizmor.yml). zizmor runs
  # offline — no token is passed — matching how the configs were validated.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-shear runs `cargo metadata`, so it needs cargo on PATH.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos-cli,cargo-shear,zizmor
      - run: typos
      - run: cargo shear
      - run: zizmor .github/workflows/
