name: Scorecard

# OpenSSF Scorecard: automated supply-chain / repo-hygiene checks. Run "as is" —
# we surface the score for transparency, not to chase a number. Weekly schedule
# catches drift; push-on-main and branch_protection_rule keep the badge current.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1" # Mondays 07:20 UTC

# Default: least privilege. The analysis job asks for the extra scopes it needs.
permissions:
  contents: read

# All actions are pinned to full commit SHAs (supply chain, Д8).
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Job-level permissions REPLACE the workflow default, so contents:read
      # must be restated here — checkout and scorecard-action read the repo.
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
      # OIDC token for publish_results — lets Scorecard attest results to the
      # public API (this is what produces the badge / transparency data).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads; never leave git credentials in the work tree
          # (zizmor: artipacked).
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF API: powers the public badge and transparency.
          publish_results: true
      # Keep the raw SARIF as an artifact for debugging a run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
