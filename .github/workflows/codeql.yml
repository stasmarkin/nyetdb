name: CodeQL

# Rust support in CodeQL went GA on 2025-10-14 (CodeQL CLI 2.23.3+), so this is
# a supported analyzer, not a preview. Runs on every push/PR plus a weekly
# schedule to catch advisories added to the query suite between commits.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Default: least privilege. security-events: write is granted only in the job
# that uploads SARIF, and nowhere else.
permissions:
  contents: read

# All actions are pinned to full commit SHAs (supply chain, D8).
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads and analyzes; it never pushes. Don't leave git
          # credentials in the work tree (zizmor: artipacked).
          persist-credentials: false
      # Rust analysis needs rustup/cargo to resolve dependencies (build-mode none).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
