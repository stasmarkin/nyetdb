name: CodeQL

# Rust support in CodeQL went GA on 2025-10-14 (CodeQL CLI 2.23.3+), so this is
# a supported analyzer, not a preview. Runs on every push/PR plus a weekly
# schedule to catch advisories added to the query suite between commits.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Default: least privilege. security-events: write is granted only in the job
# that uploads SARIF, and nowhere else.
permissions:
  contents: read

# All actions are pinned to full commit SHAs (supply chain, Д8).
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads and analyzes; it never pushes. Don't leave git
          # credentials in the work tree (zizmor: artipacked).
          persist-credentials: false
      # Rust analysis needs rustup/cargo to resolve dependencies (build-mode none).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
