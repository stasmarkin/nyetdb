name: CodeQL

# Rust support in CodeQL went GA on 2025-10-14 (CodeQL CLI 2.23.3+), so this is
# a supported analyzer, not a preview. Runs on every push/PR plus a weekly
# schedule to catch advisories added to the query suite between commits.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Default: least privilege. security-events: write is granted only in the job
# that uploads SARIF, and nowhere else.
permissions:
  contents: read

# All actions are pinned to full commit SHAs (supply chain, D8).
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads and analyzes; it never pushes. Don't leave git
          # credentials in the work tree (zizmor: artipacked).
          persist-credentials: false
      # Rust analysis needs rustup/cargo to resolve dependencies (build-mode none).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-07
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
