# zizmor config (GitHub Actions static analysis, run in CI).
#
# release.yml is generated by cargo-dist (`dist generate`); its findings are
# dist's own templates, not ours — a regenerate would clobber any hand-patch.
# They are also low-risk in context: the flagged `${{ ... }}` expansions are
# tag/ref names and dist's own matrix values, controllable only by someone who
# can already push a release tag (a maintainer). The container image is dist's,
# resolved from its plan. Suppressed here, scoped to that one generated file;
# ci.yml and fuzz.yml stay fully audited.
rules:
  template-injection:
    ignore:
      - release.yml
  artipacked:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
