[workspace]
members = ["cargo:."]

# Config for 'dist': the release pipeline (GitHub Releases + shell installer +
# Homebrew tap). Triggered by a `v*` tag; see docs/DEV.md (release process).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.7"
# CI backends to support
ci = "github"
# Emit GitHub build-provenance attestations (sigstore). dist adds an
# `actions/attest-build-provenance` step to the build job, so only the
# platform archives (the compiled binaries) are attested — verify with
# `gh attestation verify <file> --repo <owner/repo>`. The shell installer and
# Homebrew formula merely download those attested binaries; the source tarball
# and sha256 sums are NOT covered. The permissions/step are hand-hardened in
# release.yml (scoped to the build job, not workflow-wide) — see docs/DEV.md.
github-attestations = true
# The installers to generate for each app
installers = ["shell", "homebrew"]
# The Homebrew tap to publish the formula to (repo NOT created/pushed here — a
# release act; needs a HOMEBREW_TAP_TOKEN secret with write access to the tap).
tap = "stasmarkin/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). Unix only for
# v0.1: SSH tunnels and several tests are unix-only, so Windows is not released
# yet (documented in the README install section).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Do not run on pull requests (no plan job on PRs): the release workflow fires
# only on a `v` tag, so it never interferes with the main CI or publishes
# anything before a tag.
pr-run-mode = "skip"
# The generated release.yml is hand-hardened AFTER `dist generate` (SHA-pinned
# actions, least-privilege per-job permissions, `v`-prefixed tag trigger — see
# docs/DEV.md), so it intentionally differs from dist's output. Without this,
# the release pipeline's own `dist plan` job would fail its out-of-date check.
allow-dirty = ["ci"]

# dist 0.28 assigns `macos-13` to BOTH Apple targets, and GitHub retired that
# image in December 2025: the label resolves to no runner at all, so those jobs
# sit queued until they time out instead of failing loudly (v0.1.0's first
# attempt died exactly there). `macos-15-intel` is the last x86_64 macOS image
# Actions offers — through August 2027, after which x86_64 macOS ends and this
# target has to go or be cross-built. `macos-14` is the oldest Apple-silicon
# image still supported. Both jobs only build; nothing here needs a specific
# Xcode. The release pipeline's own `plan` job reads this matrix at run time,
# so changing it needs no `dist generate` and re-applies no hardenings.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-15-intel"
