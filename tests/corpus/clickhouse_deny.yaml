# --- the denylist is not fooled by case or by a database qualifier ---
- query: SELECT * FROM CLUSTER('default', system.one)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT SLEEP(3)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT system.sleep(3)
  verdict: deny
  reason: DENIED_FUNCTION

# --- the rest of the layer-1 rules hold on this dialect too ---
- query: SELECT 1; SELECT 2
  verdict: deny
  reason: MULTI_STATEMENT
- query: SELECT * FROM events WHERE
  verdict: deny
  reason: PARSE_FAILED
- query: EXPLAIN ANALYZE SELECT * FROM events
  verdict: deny
  reason: EXPLAIN_ANALYZE
