# Golden corpus — the PII policy, net A (MySQL/MariaDB dialect).
pii: users.email, users.phone

- query: SELECT email FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email AS x FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.email FROM users u
  verdict: deny
  reason: PII_COLUMN
# backtick quoting is not a way around the name
- query: SELECT `email` FROM `users`
  verdict: deny
  reason: PII_COLUMN
- query: SELECT `u`.`email` FROM `users` `u`
  verdict: deny
  reason: PII_COLUMN
- query: SELECT SUBSTRING(email, 1, 3) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT CAST(email AS CHAR) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT CONCAT(email, 'x') FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT JSON_EXTRACT(email, '$.k') FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT JSON_OBJECT('e', email) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.* FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users WHERE email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users ORDER BY 1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM users ORDER BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users GROUP BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id, count(*) FROM users GROUP BY id HAVING min(email) > 'm'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT o.id FROM orders o JOIN users u ON u.email = o.contact
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users JOIN dict USING (email)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users NATURAL JOIN dict
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users JOIN dict USING (email))
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users NATURAL JOIN dict)
  verdict: deny
  reason: PII_COLUMN
# MySQL 8.0.14+ has LATERAL too, and the AST path is identical
- query: SELECT count(*) FROM users u, LATERAL (SELECT u.*) s WHERE s.email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT NULL AS a UNION ALL TABLE users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM orders WHERE user_id IN (SELECT id FROM users WHERE email = 'a@b.c')
  verdict: deny
  reason: PII_COLUMN
- query: WITH x AS (SELECT email FROM users) SELECT count(*) FROM x
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users u JOIN orders o ON u.id = o.user_id
  verdict: deny
  reason: PII_COLUMN

# --- histogram catalogs carry real column values ---
- query: SELECT * FROM information_schema.column_statistics
  verdict: deny
  reason: PII_COLUMN
- query: SELECT histogram FROM column_statistics
  verdict: deny
  reason: PII_COLUMN
# MariaDB: mysql.column_stats stores min_value / max_value verbatim
- query: SELECT min_value, max_value FROM mysql.column_stats
  verdict: deny
  reason: PII_COLUMN

# --- must keep working ---
- query: SELECT count(*) FROM users
  verdict: allow
- query: SELECT id, created_at FROM users
  verdict: allow
- query: SELECT `id` FROM `users` WHERE `id` > 10
  verdict: allow
- query: SELECT * FROM orders
  verdict: allow
- query: SELECT * FROM orders WHERE uid IN (SELECT id FROM users)
  verdict: allow
- query: SELECT o.* FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
- query: SELECT count(*) FROM users JOIN dict USING (id)
  verdict: allow
- query: SELECT * FROM (SELECT id FROM users) t
  verdict: allow
- query: SELECT * FROM orders AS users
  verdict: allow
- query: SELECT o.email FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
- query: SELECT id, amount FROM orders WHERE amount > 10 LIMIT 5
  verdict: allow
- query: SELECT * FROM information_schema.column_statistics
  verdict: allow
  pii: none
- query: SELECT email FROM users
  verdict: allow
  pii: none
