# Golden corpus — statements that must be denied (PostgreSQL dialect).
# Dialect defaults to `postgres` from the filename prefix (see docs/dev/DEV.md).
# reason is from the closed list: PARSE_FAILED | MULTI_STATEMENT |
# WRITE_OPERATION | TXN_CONTROL | LOCKING_CLAUSE | DENIED_FUNCTION.

# --- writes / DDL ---
- query: INSERT INTO users (id, email) VALUES (1, 'a@b.c')
  verdict: deny
  reason: WRITE_OPERATION
- query: UPDATE users SET email = 'x@y.z' WHERE id = 1
  verdict: deny
  reason: WRITE_OPERATION
- query: DELETE FROM users WHERE id = 1
  verdict: deny
  reason: WRITE_OPERATION
- query: DROP TABLE users
  verdict: deny
  reason: WRITE_OPERATION
- query: CREATE TABLE t (id integer)
  verdict: deny
  reason: WRITE_OPERATION
- query: ALTER TABLE users ADD COLUMN nick text
  verdict: deny
  reason: WRITE_OPERATION
- query: TRUNCATE users
  verdict: deny
  reason: WRITE_OPERATION

# --- writes smuggled into a CTE / subquery (data-modifying CTE, DESIGN §3) ---
- query: WITH x AS (DELETE FROM t RETURNING *) SELECT * FROM x
  verdict: deny
  reason: WRITE_OPERATION
- query: WITH x AS (INSERT INTO t VALUES (1) RETURNING id) SELECT * FROM x
  verdict: deny
  reason: WRITE_OPERATION
- query: WITH x AS (UPDATE t SET a = 1 RETURNING a) SELECT * FROM x
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT * FROM (DELETE FROM t RETURNING *) d
  verdict: deny
  reason: WRITE_OPERATION
- query: EXPLAIN ANALYZE UPDATE users SET email = 'x'
  verdict: deny
  reason: WRITE_OPERATION
# A write inside the parenthesized option form is caught by the recursive walk
# too (a different parse shape: the options land beside the statement).
- query: EXPLAIN (ANALYZE, FORMAT JSON) DELETE FROM users
  verdict: deny
  reason: WRITE_OPERATION
# EXPLAIN ANALYZE *executes* the statement — refused over a plain read as well,
# in both spellings (the keyword one, and the PostgreSQL option form, which
# sqlparser keeps in a different field).
- query: EXPLAIN ANALYZE SELECT * FROM users
  verdict: deny
  reason: EXPLAIN_ANALYZE
- query: EXPLAIN (ANALYZE, FORMAT JSON) SELECT * FROM users
  verdict: deny
  reason: EXPLAIN_ANALYZE
- query: EXPLAIN (ANALYZE) SELECT 1
  verdict: deny
  reason: EXPLAIN_ANALYZE
# PostgreSQL also accepts the BRITISH spelling, and it executes just the same —
# a name match on "analyze" alone let this one run the query in full.
- query: EXPLAIN (ANALYSE) SELECT 1
  verdict: deny
  reason: EXPLAIN_ANALYZE
- query: EXPLAIN (analyse true) SELECT 1
  verdict: deny
  reason: EXPLAIN_ANALYZE
- query: EXPLAIN (BUFFERS, ANALYSE) SELECT 1
  verdict: deny
  reason: EXPLAIN_ANALYZE
# The bare keyword form of it: sqlparser does not know ANALYSE, so it fails
# closed at the parser instead — pinned so a future parser upgrade that starts
# accepting it cannot silently turn it into an allow.
- query: EXPLAIN ANALYSE SELECT 1
  verdict: deny
  reason: PARSE_FAILED

# --- COPY moves data in/out of the server; never a plain read ---
- query: COPY users TO STDOUT
  verdict: deny
  reason: WRITE_OPERATION
- query: COPY users FROM STDIN
  verdict: deny
  reason: WRITE_OPERATION
- query: COPY (SELECT * FROM users) TO STDOUT
  verdict: deny
  reason: WRITE_OPERATION

# SELECT ... INTO is create-table-as in PostgreSQL — a write, not a read.
- query: SELECT * INTO t2 FROM users
  verdict: deny
  reason: WRITE_OPERATION

# --- session / transaction control ---
- query: SET search_path = public
  verdict: deny
  reason: TXN_CONTROL
- query: BEGIN
  verdict: deny
  reason: TXN_CONTROL
- query: COMMIT
  verdict: deny
  reason: TXN_CONTROL
- query: ROLLBACK
  verdict: deny
  reason: TXN_CONTROL

# --- multiple statements: the classic piggyback ---
- query: SELECT 1; SELECT 2
  verdict: deny
  reason: MULTI_STATEMENT
- query: SELECT * FROM users; DELETE FROM users
  verdict: deny
  reason: MULTI_STATEMENT

# --- locking clauses (DESIGN §3 step 6) ---
- query: SELECT * FROM users FOR UPDATE
  verdict: deny
  reason: LOCKING_CLAUSE
- query: SELECT * FROM users FOR SHARE
  verdict: deny
  reason: LOCKING_CLAUSE
- query: WITH x AS (SELECT * FROM users FOR UPDATE) SELECT * FROM x
  verdict: deny
  reason: LOCKING_CLAUSE
# The other two PostgreSQL lock strengths: sqlparser does not know them, so
# they fail closed at the parser instead of at the locking check — pinned so a
# parser upgrade that starts accepting them cannot turn either into an allow.
- query: SELECT * FROM users FOR NO KEY UPDATE
  verdict: deny
  reason: PARSE_FAILED
- query: SELECT * FROM users FOR KEY SHARE
  verdict: deny
  reason: PARSE_FAILED

# --- function denylist (DESIGN §3 step 7; rationale in docs/dev/DEV.md) ---
- query: SELECT pg_sleep(10)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_read_file('/etc/passwd')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_terminate_backend(1234)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_cancel_backend(1234)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_reload_conf()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_promote()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT lo_import('/etc/passwd')
  verdict: deny
  reason: DENIED_FUNCTION
# lo_export writes a server file (write side of lo_import)
- query: SELECT lo_export(12345, '/tmp/leak')
  verdict: deny
  reason: DENIED_FUNCTION
# nextval/setval mutate a sequence — EXCLUDED from read-only txns by Postgres,
# so they are durable writes bypassing both layers; the validator is the guard
- query: SELECT nextval('users_id_seq')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT setval('users_id_seq', 1)
  verdict: deny
  reason: DENIED_FUNCTION
# pg_logical_emit_message: non-transactional WAL write, survives ROLLBACK
- query: SELECT pg_logical_emit_message(false, 'nyet', 'x')
  verdict: deny
  reason: DENIED_FUNCTION
# pg_sleep family (all three enumerated so allow_functions can still un-deny)
- query: SELECT pg_sleep_for('5 minutes')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_sleep_until('tomorrow')
  verdict: deny
  reason: DENIED_FUNCTION
# advisory-lock family (all 11 pg_catalog names enumerated, like *_to_xml, so
# allow_functions can still un-deny one). Taking a lock is not a read: the
# SESSION-scoped ones survive ROLLBACK (measured) and only die with the backend,
# and every blocking form hangs the query until the server's statement_timeout.
- query: SELECT pg_advisory_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_try_advisory_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_advisory_lock_shared(1, 2)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_try_advisory_lock_shared(1, 2)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_advisory_unlock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_advisory_unlock_shared(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_advisory_unlock_all()
  verdict: deny
  reason: DENIED_FUNCTION
# transactional variants: released at COMMIT/ROLLBACK, so they survive nothing —
# denied anyway (the blocking ones hang to statement_timeout, the try_ ones still
# block another application for the life of nyet's transaction, and no read needs
# a lock). One rule per family beats "some advisory locks, but not those".
- query: SELECT pg_advisory_xact_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_advisory_xact_lock_shared(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_try_advisory_xact_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_try_advisory_xact_lock_shared(1, 2)
  verdict: deny
  reason: DENIED_FUNCTION
# the same call in table-function position, schema-qualified, and under a plain
# EXPLAIN (the paths that reach check_function_name through another AST node)
- query: SELECT * FROM pg_advisory_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_catalog.pg_try_advisory_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: EXPLAIN SELECT pg_advisory_lock(42)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT 1 FROM t WHERE pg_try_advisory_xact_lock(id)
  verdict: deny
  reason: DENIED_FUNCTION
# LOCK TABLE takes a table lock without any function call — not a read
- query: LOCK TABLE users IN ACCESS EXCLUSIVE MODE
  verdict: deny
  reason: WRITE_OPERATION
- query: LOCK TABLE users
  verdict: deny
  reason: WRITE_OPERATION
# file-read family, prefix-matched (pg_read_*, pg_ls_*) + pg_stat_file
- query: SELECT pg_read_binary_file('/etc/passwd')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_ls_dir('/')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_ls_waldir()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_stat_file('/etc/passwd')
  verdict: deny
  reason: DENIED_FUNCTION
# case-insensitive
- query: SELECT PG_SLEEP(1)
  verdict: deny
  reason: DENIED_FUNCTION
# schema-qualified
- query: SELECT pg_catalog.pg_sleep(1)
  verdict: deny
  reason: DENIED_FUNCTION
# denied function outside the projection
- query: SELECT 1 FROM t WHERE pg_sleep(1) IS NOT NULL
  verdict: deny
  reason: DENIED_FUNCTION
# the dblink family is prefix-matched: an un-enumerated member is still denied
- query: SELECT dblink('conn', 'SELECT 1')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT dblink_exec('conn', 'DELETE FROM t')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT dblink_connect('conn', 'host=evil')
  verdict: deny
  reason: DENIED_FUNCTION
# dblink as a table function (call syntax in FROM)
- query: SELECT * FROM dblink('conn', 'SELECT 1')
  verdict: deny
  reason: DENIED_FUNCTION

# --- W7 audit (August 2026): reads with side effects that layer 2 does NOT
# stop. Every one of these was measured running inside `BEGIN READ ONLY` on
# postgres:16-alpine — the same test the nextval/setval entries above earn
# their place with. Most are stopped by a read-only role, which nyet can only
# recommend; txid_current is not stopped by one at all.

# XID assignment: burns a cluster-global transaction id per call (measured:
# three calls advanced xmax by three, three plain SELECTs by none), which is
# the nextval class one scope wider — and the only entry here that a read-only
# role does not stop.
- query: SELECT txid_current()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_current_xact_id()
  verdict: deny
  reason: DENIED_FUNCTION

# Cluster-level WAL / backup state: written, not undone by ROLLBACK, and
# pg_backup_start leaves the cluster in backup mode until someone stops it.
- query: SELECT pg_create_restore_point('x')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_switch_wal()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_rotate_logfile()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_backup_start('label')
  verdict: deny
  reason: DENIED_FUNCTION

# Replication slots pin WAL: a slot created through a "read" can fill the
# server's disk, and dropping one breaks a live replica.
- query: SELECT pg_create_physical_replication_slot('s')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_create_logical_replication_slot('s', 'pgoutput')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_drop_replication_slot('s')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_replication_slot_advance('s', '0/0')
  verdict: deny
  reason: DENIED_FUNCTION
# get_changes CONSUMES from the slot (durable advance); peek_changes does not
# and stays allowed.
- query: SELECT pg_logical_slot_get_changes('s', NULL, NULL)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_replication_origin_create('o')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_replication_origin_drop('o')
  verdict: deny
  reason: DENIED_FUNCTION

# Statistics resets: irreversible for everyone on the server (prefix-matched).
- query: SELECT pg_stat_reset()
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_stat_reset_shared('bgwriter')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_stat_reset_single_table_counters(1)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_stat_statements_reset()
  verdict: deny
  reason: DENIED_FUNCTION

# Index maintenance writes to the index, right through a read-only transaction.
- query: SELECT brin_summarize_new_values('idx')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT gin_clean_pending_list('idx')
  verdict: deny
  reason: DENIED_FUNCTION

# DDL and messaging wearing a function's clothes.
- query: SELECT pg_import_system_collations('pg_catalog')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT pg_notify('chan', 'payload')
  verdict: deny
  reason: DENIED_FUNCTION
# `SET` wearing a function's clothes: the statement form is TXN_CONTROL, so
# the wrapper cannot stay allowed (it sets statement_timeout for the session).
- query: SELECT set_config('statement_timeout', '0', false)
  verdict: deny
  reason: DENIED_FUNCTION

# The reading halves of those families stay allowed — a denylist that swallows
# introspection would push people to allow_functions the whole family back.
- query: SELECT pg_current_xact_id_if_assigned()
  verdict: allow
- query: SELECT pg_logical_slot_peek_changes('s', NULL, NULL)
  verdict: allow
- query: SELECT pg_relation_size('t')
  verdict: allow
- query: SELECT currval('s')
  verdict: allow

# --- unparseable -> fail closed ---
- query: this is not sql at all
  verdict: deny
  reason: PARSE_FAILED
- query: SELECT * FROM
  verdict: deny
  reason: PARSE_FAILED

# --- W7 audit (August 2026): parser-vs-server, the fail-closed half ---
# A backslash does NOT escape a quote under standard_conforming_strings=on
# (the default), so the semicolon really is a separator — and the validator
# reads it the same way the server does.
- query: SELECT '\';DROP TABLE t;--'
  verdict: deny
  reason: MULTI_STATEMENT
- query: SELECT $$a$$ ; DROP TABLE t
  verdict: deny
  reason: MULTI_STATEMENT
# A homoglyph in a keyword (Cyrillic С in SELECT) does not parse — fail closed
# rather than guessing at what the server might fold it to.
- query: SELEСT 1
  verdict: deny
  reason: PARSE_FAILED

# --- W7 (found by the fuzzer): a too-deep expression is refused, and refused
# PROMPTLY. sqlparser's cost of hitting its recursion cap is exponential in the
# cap itself, so the default 50 turned ~700 bytes of nesting into an unbounded
# stall — before any database, and so past every timeout nyet sets.
- query: SELECT cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(cast(1 as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text) as text)
  verdict: deny
  reason: PARSE_FAILED

