# Golden corpus — statements that must be denied (SQLite dialect).
# Every deny carries a reason from the closed list (see enum DenyReason in
# src/validator.rs): PARSE_FAILED | MULTI_STATEMENT | WRITE_OPERATION |
# TXN_CONTROL | LOCKING_CLAUSE | DENIED_FUNCTION.

# --- writes / DDL ---
- query: INSERT INTO users (id, email) VALUES (1, 'a@b.c')
  verdict: deny
  reason: WRITE_OPERATION
- query: UPDATE users SET email = 'x@y.z' WHERE id = 1
  verdict: deny
  reason: WRITE_OPERATION
- query: DELETE FROM users WHERE id = 1
  verdict: deny
  reason: WRITE_OPERATION
- query: DELETE FROM users
  verdict: deny
  reason: WRITE_OPERATION
- query: DROP TABLE users
  verdict: deny
  reason: WRITE_OPERATION
- query: CREATE TABLE t (id INTEGER)
  verdict: deny
  reason: WRITE_OPERATION
- query: CREATE INDEX idx_users_email ON users(email)
  verdict: deny
  reason: WRITE_OPERATION
- query: ALTER TABLE users ADD COLUMN nick TEXT
  verdict: deny
  reason: WRITE_OPERATION

# --- writes smuggled into a Query statement body ---
- query: WITH x AS (SELECT 1) DELETE FROM t
  verdict: deny
  reason: WRITE_OPERATION
- query: WITH x AS (SELECT 1) INSERT INTO t SELECT * FROM x
  verdict: deny
  reason: WRITE_OPERATION
- query: WITH x AS (SELECT 1) UPDATE t SET a = 1
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT * INTO t2 FROM users
  verdict: deny
  reason: WRITE_OPERATION
# set operations: the write can hide in either operand (or a parenthesized one)
- query: SELECT * INTO t FROM users UNION SELECT 1
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT 1 UNION SELECT * INTO t FROM users
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT 1 UNION (SELECT * INTO t FROM users)
  verdict: deny
  reason: WRITE_OPERATION

# --- EXPLAIN wrapping a write (EXPLAIN ANALYZE executes it on some engines) ---
- query: EXPLAIN DELETE FROM users
  verdict: deny
  reason: WRITE_OPERATION
- query: EXPLAIN ANALYZE UPDATE users SET email = 'x'
  verdict: deny
  reason: WRITE_OPERATION
# EXPLAIN ANALYZE *executes* the statement, so it is refused on its own —
# even over a plain read, where nothing else would stop it (the allow twin
# `EXPLAIN SELECT ...` is above).
- query: EXPLAIN ANALYZE SELECT * FROM users
  verdict: deny
  reason: EXPLAIN_ANALYZE

# --- multiple statements: the classic piggyback ---
- query: SELECT 1; SELECT 2
  verdict: deny
  reason: MULTI_STATEMENT
- query: SELECT * FROM users; DELETE FROM users
  verdict: deny
  reason: MULTI_STATEMENT

# --- session / database state ---
# Every PRAGMA form hits a pre-parse keyword check (sqlparser cannot parse
# the call form or keyword values) -> one teaching refusal for all of them.
- query: PRAGMA case_sensitive_like = 1
  verdict: deny
  reason: WRITE_OPERATION
- query: PRAGMA journal_mode = DELETE
  verdict: deny
  reason: WRITE_OPERATION
- query: PRAGMA table_info(users)
  verdict: deny
  reason: WRITE_OPERATION
- query: PRAGMA user_version
  verdict: deny
  reason: WRITE_OPERATION
- query: pragma user_version
  verdict: deny
  reason: WRITE_OPERATION
- query: ATTACH DATABASE '/tmp/other.db' AS other
  verdict: deny
  reason: WRITE_OPERATION

# --- transaction control ---
- query: BEGIN
  verdict: deny
  reason: TXN_CONTROL
- query: BEGIN TRANSACTION
  verdict: deny
  reason: TXN_CONTROL
- query: COMMIT
  verdict: deny
  reason: TXN_CONTROL
- query: ROLLBACK
  verdict: deny
  reason: TXN_CONTROL
- query: SET search_path = public
  verdict: deny
  reason: TXN_CONTROL

# --- unparseable -> fail closed ---
- query: this is not sql at all
  verdict: deny
  reason: PARSE_FAILED
- query: SELECT * FROM
  verdict: deny
  reason: PARSE_FAILED

# --- writes nested deeper in the tree (recursive AST walk, DESIGN §3 step 5) ---
- query: WITH x AS (DELETE FROM t) SELECT 1
  verdict: deny
  reason: WRITE_OPERATION
- query: WITH x AS (INSERT INTO t VALUES (1) RETURNING id) SELECT * FROM x
  verdict: deny
  reason: WRITE_OPERATION
- query: WITH x AS (UPDATE t SET a = 1 RETURNING a) SELECT * FROM x
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT * FROM (DELETE FROM t RETURNING *) d
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT * FROM users JOIN (UPDATE t SET a = 1 RETURNING *) u ON u.id = users.id
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT 1 WHERE EXISTS (SELECT 1 FROM (DELETE FROM t) q)
  verdict: deny
  reason: WRITE_OPERATION
- query: SELECT (SELECT 1 FROM (INSERT INTO t VALUES (1) RETURNING id) q)
  verdict: deny
  reason: WRITE_OPERATION
- query: EXPLAIN SELECT * FROM (DELETE FROM t) d
  verdict: deny
  reason: WRITE_OPERATION
# nested EXPLAIN is a parser error in sqlparser -> fail closed
- query: EXPLAIN EXPLAIN SELECT 1
  verdict: deny
  reason: PARSE_FAILED

# --- locking clauses (DESIGN §3 step 6) ---
- query: SELECT * FROM users FOR UPDATE
  verdict: deny
  reason: LOCKING_CLAUSE
- query: SELECT * FROM users FOR SHARE
  verdict: deny
  reason: LOCKING_CLAUSE
- query: WITH x AS (SELECT 1) SELECT * FROM x FOR UPDATE
  verdict: deny
  reason: LOCKING_CLAUSE

# --- function denylist (DESIGN §3 step 7; rationale in docs/dev/DEV.md) ---
- query: SELECT load_extension('/tmp/evil.so')
  verdict: deny
  reason: DENIED_FUNCTION
# case-insensitive
- query: SELECT LOAD_EXTENSION('/tmp/evil.so')
  verdict: deny
  reason: DENIED_FUNCTION
# qualified name
- query: SELECT main.load_extension('/tmp/evil.so')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT writefile('/tmp/x', 'data')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT readfile('/etc/passwd')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT edit('x')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT fts3_tokenizer('simple')
  verdict: deny
  reason: DENIED_FUNCTION
# denied function outside the projection
- query: SELECT 1 FROM t WHERE load_extension('x')
  verdict: deny
  reason: DENIED_FUNCTION
# table-valued-function call syntax
- query: SELECT * FROM load_extension('x')
  verdict: deny
  reason: DENIED_FUNCTION
# denied function via LATERAL table factor (TableFactor::Function — bypassed
# the projection/Table-args checks before the fix)
- query: SELECT * FROM LATERAL load_extension('x')
  verdict: deny
  reason: DENIED_FUNCTION
# denied function via TABLE(...) table factor (inner Expr::Function)
- query: SELECT * FROM TABLE(load_extension('x'))
  verdict: deny
  reason: DENIED_FUNCTION
# nested locking clause: FOR UPDATE on a CTE's inner query (pins that
# pre_visit_query runs for nested queries, not just the outer one)
- query: WITH x AS (SELECT * FROM users FOR UPDATE) SELECT * FROM x
  verdict: deny
  reason: LOCKING_CLAUSE

# savepoint statements are transaction control
- query: SAVEPOINT s
  verdict: deny
  reason: TXN_CONTROL
- query: RELEASE SAVEPOINT s
  verdict: deny
  reason: TXN_CONTROL
# ROLLBACK TO SAVEPOINT parses as Rollback -> same TXN_CONTROL branch
- query: ROLLBACK TO SAVEPOINT s
  verdict: deny
  reason: TXN_CONTROL
