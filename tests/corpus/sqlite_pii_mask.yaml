# Golden corpus — the PII policy under mode = "mask" (SQLite dialect).
# The SAME rules as sqlite_pii.yaml, one mode apart: masking relaxes exactly one
# shape — a plain, unaliased projection of the column in the ROOT select — and
# nothing else; sorting/grouping/dedup ON THAT COLUMN (by name or by position)
# is refused too. Every deny case below has an allow twin in sqlite_pii.yaml
# under mode = "deny" or vice versa.
pii: users.email, users.phone
pii_mode: mask

# --- what mask allows (net B redacts the values) ---
- query: SELECT email FROM users
  verdict: allow
- query: SELECT id, email, phone FROM users
  verdict: allow
- query: SELECT u.email FROM users u
  verdict: allow
- query: SELECT "email" FROM "users"
  verdict: allow
- query: SELECT email FROM users WHERE id = 1
  verdict: allow
- query: SELECT email FROM users LIMIT 10
  verdict: allow
- query: SELECT id, email FROM users u JOIN orders o ON u.id = o.uid
  verdict: allow

# --- everything else keeps the deny-mode verdict ---
# an ALIAS is a second name for the value, and SQLite accepts it in WHERE
# (`... WHERE x LIKE 'a%'`), where nyet can no longer recognise it
- query: SELECT email AS x FROM users
  verdict: deny
  reason: PII_COLUMN
# an expression carries no provenance, so net B could not mask it
- query: SELECT substr(email, 1, 3) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email || 'x' FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT json_object('e', email) FROM users
  verdict: deny
  reason: PII_COLUMN
# filters, sorts and grouping read the real value back out of the row count or
# the row order — even when every cell is redacted
- query: SELECT count(*) FROM users WHERE email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users WHERE email IS NOT NULL
  verdict: deny
  reason: PII_COLUMN
# sorting/grouping by the masked column, named or by POSITION
- query: SELECT email FROM users ORDER BY 1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users ORDER BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id, email FROM users ORDER BY 2
  verdict: deny
  reason: PII_COLUMN
- query: SELECT DISTINCT email FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT DISTINCT id, email FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users GROUP BY 1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id, email FROM users GROUP BY 2
  verdict: deny
  reason: PII_COLUMN
# ...but sorting/grouping by an UNPROTECTED column is ordinary and must work:
# it cannot reach the masked value (by name it is refused above, and a masked
# item never carries an alias to reach it by)
- query: SELECT id, email FROM users ORDER BY id
  verdict: allow
- query: SELECT id, email FROM users ORDER BY created_at DESC
  verdict: allow
- query: SELECT id, email FROM users GROUP BY id
  verdict: allow
- query: SELECT email, count(*) FROM users GROUP BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM users ORDER BY email
  verdict: deny
  reason: PII_COLUMN
# a nested projection hands its column to another layer, where the driver's
# provenance is exactly the documented view limitation
- query: WITH x AS (SELECT email FROM users) SELECT count(*) FROM x
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM (SELECT email FROM users) t
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users UNION ALL SELECT contact FROM signups
  verdict: deny
  reason: PII_COLUMN
- query: SELECT (SELECT email FROM users LIMIT 1) AS x
  verdict: deny
  reason: PII_COLUMN
# whole-row reads, in every spelling
- query: SELECT * FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.* FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u FROM users u
  verdict: deny
  reason: PII_COLUMN
# join oracles
- query: SELECT count(*) FROM users JOIN dict USING (email)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users NATURAL JOIN dict
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users JOIN dict USING (email))
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users JOIN dict USING (email)
  verdict: deny
  reason: PII_COLUMN
# positional rename and the value-sampling catalog
- query: SELECT c FROM users AS u (a, b, c)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT sample FROM sqlite_stat4
  verdict: deny
  reason: PII_COLUMN

# a wildcard expands into N columns, so nyet cannot say which RESULT column is
# the protected one — mixing the two is refused rather than guessed
- query: SELECT o.*, u.email FROM orders o, users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.email, o.* FROM orders o, users u
  verdict: deny
  reason: PII_COLUMN
# every spelling the engines read as an ordinal, not just the bare number
- query: SELECT email, id FROM users ORDER BY +1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY (1)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY ((+1))
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users GROUP BY +1
  verdict: deny
  reason: PII_COLUMN
# ...but a wildcard with nothing protected beside it, and an ordinal pointing at
# an unprotected column, are ordinary queries
- query: SELECT o.* FROM orders o, users u
  verdict: allow

# ORDER BY / GROUP BY take plain column NAMES while a masked column is
# projected: nyet does not model which spellings a planner folds into an
# ordinal (measured ordinals include 0x1, -(-1), `1 COLLATE ...`, 0_1), so a key
# that is not a name is refused whatever it is
- query: SELECT id, email FROM users ORDER BY 1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY -(-1)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY abs(1)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY 1 + 0
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users GROUP BY -(-1)
  verdict: deny
  reason: PII_COLUMN
# ...and a NAME still works, which is the case the guard was narrowed for
- query: SELECT id, email FROM users ORDER BY created_at DESC
  verdict: allow
- query: SELECT id, email FROM users u ORDER BY u.id
  verdict: allow

- query: SELECT email, id FROM users ORDER BY 0x2
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY -(-2)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY (2)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY 2 COLLATE NOCASE
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY (2) COLLATE BINARY
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY 2 + 0
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY abs(2)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY CAST(2 AS INT)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email, id FROM users ORDER BY (SELECT 2)
  verdict: deny
  reason: PII_COLUMN

# --- unchanged by the mode ---
- query: SELECT count(*) FROM users
  verdict: allow
- query: SELECT id, created_at FROM users
  verdict: allow
- query: SELECT * FROM orders
  verdict: allow
- query: SELECT o.email FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
