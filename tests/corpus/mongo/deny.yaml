# Golden corpus — MongoDB queries that must be REFUSED. Every case carries the
# reason from the closed list: PARSE_FAILED | WRITE_OPERATION | DENIED_FUNCTION
# | DENIED_COMMAND | DENIED_OPERATOR (see src/mongo.rs).

# --- writing collection methods ---
- query: db.users.insertOne({a: 1})
  verdict: deny
  reason: WRITE_OPERATION
- query: db.users.insertMany([{a: 1}])
  verdict: deny
  reason: WRITE_OPERATION
- query: db.users.insert({a: 1})
  verdict: deny
  reason: WRITE_OPERATION
- query: db.users.updateOne({a: 1}, {$set: {b: 2}})
