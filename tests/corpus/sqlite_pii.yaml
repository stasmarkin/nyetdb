# Golden corpus — the PII policy, net A (SQLite dialect).
pii: users.email, users.phone

- query: SELECT email FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email AS x FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.email FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT "email" FROM "users"
  verdict: deny
  reason: PII_COLUMN
- query: SELECT substr(email, 1, 3) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT CAST(email AS TEXT) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email || 'x' FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT json_object('e', email) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.* FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users WHERE email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users ORDER BY 1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM users ORDER BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users GROUP BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id, count(*) FROM users GROUP BY id HAVING max(email) > 'm'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT o.id FROM orders o JOIN users u ON u.email = o.contact
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users JOIN dict USING (email)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users NATURAL JOIN dict
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users JOIN dict USING (email))
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users NATURAL JOIN dict)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM (users JOIN dict ON 1 = 1)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.* FROM (users u JOIN dict ON 1 = 1)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM orders WHERE user_id IN (SELECT id FROM users WHERE email = 'a@b.c')
  verdict: deny
  reason: PII_COLUMN
- query: WITH x AS (SELECT email FROM users) SELECT count(*) FROM x
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users u JOIN orders o ON u.id = o.user_id
  verdict: deny
  reason: PII_COLUMN
# sqlite_stat4 stores sampled index-key VALUES (sqlite_stat1 holds only counts)
- query: SELECT sample FROM sqlite_stat4
  verdict: deny
  reason: PII_COLUMN

# --- must keep working ---
- query: SELECT count(*) FROM users
  verdict: allow
- query: SELECT id, created_at FROM users
  verdict: allow
- query: SELECT * FROM orders
  verdict: allow
- query: SELECT * FROM orders WHERE uid IN (SELECT id FROM users)
  verdict: allow
- query: SELECT o.* FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
- query: SELECT count(*) FROM users JOIN dict USING (id)
  verdict: allow
- query: SELECT * FROM (SELECT id FROM users) t
  verdict: allow
- query: SELECT * FROM orders AS users
  verdict: allow
- query: SELECT o.email FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
- query: SELECT s.email FROM users u JOIN (SELECT id, contact AS email FROM signups) s ON s.id = u.id
  verdict: allow
- query: SELECT id, amount FROM orders WHERE amount > 10 LIMIT 5
  verdict: allow
# a user table that merely shares a name with MariaDB's histogram catalog
- query: SELECT n FROM column_stats
  verdict: allow
- query: SELECT * FROM column_statistics
  verdict: allow
- query: SELECT name, sql FROM sqlite_master WHERE type = 'table'
  verdict: allow
- query: SELECT * FROM sqlite_stat1
  verdict: allow
- query: SELECT email FROM users
  verdict: allow
  pii: none
