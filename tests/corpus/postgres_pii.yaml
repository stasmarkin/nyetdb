# Golden corpus — the PII policy, net A (PostgreSQL dialect).
# The file-wide `pii:` line below is this connection's
# [connections.X.pii] columns = [...]; `orders` carries no rule, so every
# query that stays inside it must keep working exactly as before (UX-5).
pii: users.email, users.phone, app.customers.ssn

# --- the protected column, named anywhere ---
- query: SELECT email FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email AS x FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.email FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT users.email FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT EMAIL FROM USERS
  verdict: deny
  reason: PII_COLUMN
- query: SELECT phone FROM users
  verdict: deny
  reason: PII_COLUMN
# schema.table.column rules match on the table.column tail
- query: SELECT ssn FROM customers
  verdict: deny
  reason: PII_COLUMN
- query: SELECT ssn FROM app.customers
  verdict: deny
  reason: PII_COLUMN

# --- wrapped in an expression: the inner reference is what counts ---
- query: SELECT substr(email, 1, 3) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT CAST(email AS TEXT) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email::int FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT concat(email, 'x') FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT md5(email) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT length(email) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT json_build_object('e', email) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT to_jsonb(email) FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(DISTINCT email) FROM users
  verdict: deny
  reason: PII_COLUMN

# --- whole-row projections over a protected table ---
- query: SELECT * FROM users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.* FROM users u
  verdict: deny
  reason: PII_COLUMN
# PostgreSQL composite: the bare alias IS the whole row
- query: SELECT u FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT users FROM users
  verdict: deny
  reason: PII_COLUMN

# --- parser blind spots that used to switch the whole net off ---
# sqlparser reads `ONLY` as the table name and `users` as its alias
- query: SELECT email FROM ONLY users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM ONLY users
  verdict: deny
  reason: PII_COLUMN
# ...and its parenthesised twin, which sqlparser reads as a TABLE FUNCTION
- query: SELECT email FROM ONLY (users)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM ONLY(users)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM ONLY (public.users)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM ONLY (users)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email || '' FROM ONLY (users)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM ONLY (users) WHERE email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM ONLY (users) JOIN dict USING (email)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM ONLY (users) NATURAL JOIN dict
  verdict: deny
  reason: PII_COLUMN
- query: SELECT most_common_vals FROM ONLY (pg_stats)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT (SELECT email FROM ONLY (users) LIMIT 1) AS x
  verdict: deny
  reason: PII_COLUMN
- query: SELECT 1 FROM (SELECT 1) z, ONLY (users)
  verdict: deny
  reason: PII_COLUMN

# a correlated sub-SELECT has an empty FROM, so a LOCAL wildcard scope saw
# nothing to protect while `u.*` copied every protected column outwards
- query: SELECT count(*) FROM users u, LATERAL (SELECT u.*) s WHERE s.email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT s.email FROM users u, LATERAL (SELECT u.*) s
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users u CROSS JOIN LATERAL (SELECT u.*) AS s(a, b, c, d) WHERE s.b LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users u, LATERAL (SELECT * FROM (SELECT u.*) q) s WHERE s.email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN

# *_to_xml runs a SQL string the parser never sees, and dumps whole relations
- query: SELECT query_to_xml('select email from users', true, false, '')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT table_to_xml('users'::regclass, true, false, '')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT cast(schema_to_xml('public', true, false, '') as text)
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT xpath('//email/text()', query_to_xml('select email from users', true, false, ''))
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT database_to_xml_and_xmlschema(true, false, '')
  verdict: deny
  reason: DENIED_FUNCTION
- query: SELECT query_to_xmlschema('select 1', true, false, '')
  verdict: deny
  reason: DENIED_FUNCTION
# the denylist bypass this family opened is wider than PII: it re-enabled
# every function the validator refuses, whatever the connection's policy
- query: SELECT query_to_xml('select pg_sleep(3)', true, false, '')
  verdict: deny
  reason: DENIED_FUNCTION
  pii: none

# PIVOT/UNPIVOT wrap a table factor: the wrapped relation must reach the scope
- query: SELECT * FROM users PIVOT (count(id) FOR dept IN ('a'))
  verdict: deny
  reason: PII_COLUMN

# a wildcard over a parenthesised join must see the join's own sources
- query: SELECT * FROM (users JOIN dict ON true)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT u.* FROM (users u JOIN dict ON true)
  verdict: deny
  reason: PII_COLUMN

# `ONLY users u` is not parseable at all -> fail closed on the parser instead
- query: SELECT u FROM ONLY users u
  verdict: deny
  reason: PARSE_FAILED
- query: SELECT users FROM ONLY users
  verdict: deny
  reason: PII_COLUMN
# alias column list renames the protected column positionally
- query: SELECT c FROM users AS u (a, b, c)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT a FROM users u (a)
  verdict: deny
  reason: PII_COLUMN
# f(t.*) expands the whole row inside a function call
- query: SELECT concat(u.*) FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT json_agg(u.*) FROM users u
  verdict: deny
  reason: PII_COLUMN
- query: SELECT json_agg(users.*) FROM users
  verdict: deny
  reason: PII_COLUMN

# `TABLE t` is a whole-row read that sqlparser keeps as a plain String inside
# SetExpr, outside any TableFactor — it used to switch net A off entirely
- query: SELECT NULL AS a UNION ALL TABLE users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT NULL AS a UNION ALL TABLE public.users
  verdict: deny
  reason: PII_COLUMN
# standalone `TABLE t` is not parseable here -> fail closed on the parser; the
# reachable shape is the right operand of a set operation, above and below
- query: TABLE users
  verdict: deny
  reason: PARSE_FAILED
- query: SELECT NULL AS a EXCEPT TABLE users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT NULL AS a UNION ALL SELECT NULL UNION ALL TABLE users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT NULL AS a UNION ALL TABLE pg_stats
  verdict: deny
  reason: PII_COLUMN

# a parenthesised join hides its constraint one level down
- query: SELECT count(*) FROM (users JOIN dict USING (email))
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users NATURAL JOIN dict)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM orders o JOIN (users JOIN dict USING (email)) x ON true
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM (users NATURAL JOIN (SELECT 'a@b.c' AS email) d)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM ((users JOIN dict USING (email)) JOIN orders ON true)
  verdict: deny
  reason: PII_COLUMN

# a table-valued function argument is the other side of the f(t.*) AST
- query: SELECT 1 FROM users u, f(u.*)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT 1 FROM users u, LATERAL f(u.*)
  verdict: deny
  reason: PII_COLUMN

# --- clauses that never return the value but leak it anyway ---
# row_count under a LIKE filter is a character-by-character oracle
- query: SELECT count(*) FROM users WHERE email LIKE 'a%'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM users ORDER BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT email FROM users ORDER BY 1
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users GROUP BY email
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id, count(*) FROM users GROUP BY id HAVING max(email) > 'm'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT o.id FROM orders o JOIN users u ON u.email = o.contact
  verdict: deny
  reason: PII_COLUMN
# USING / NATURAL name the join column outside any Expr node
- query: SELECT count(*) FROM users JOIN dict USING (email)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users LEFT JOIN dict USING (id, email)
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM users NATURAL JOIN dict
  verdict: deny
  reason: PII_COLUMN
- query: SELECT count(*) FROM dict NATURAL LEFT JOIN users
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM orders WHERE user_id IN (SELECT id FROM users WHERE email = 'a@b.c')
  verdict: deny
  reason: PII_COLUMN
- query: WITH x AS (SELECT email FROM users) SELECT count(*) FROM x
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM (SELECT id, email FROM users) t
  verdict: deny
  reason: PII_COLUMN
- query: SELECT id FROM users UNION ALL SELECT email FROM users
  verdict: deny
  reason: PII_COLUMN

# --- unqualified name over a mixed FROM: ownership is unprovable ---
- query: SELECT email FROM users u JOIN orders o ON u.id = o.user_id
  verdict: deny
  reason: PII_COLUMN

# --- catalogs that publish sampled VALUES ---
- query: SELECT * FROM pg_stats
  verdict: deny
  reason: PII_COLUMN
- query: SELECT most_common_vals FROM pg_stats WHERE tablename = 'users'
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM pg_catalog.pg_stats
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM pg_statistic
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM pg_stats_ext
  verdict: deny
  reason: PII_COLUMN
- query: SELECT * FROM pg_statistic_ext_data
  verdict: deny
  reason: PII_COLUMN

# --- what MUST keep working (or the feature is just a wall) ---
- query: SELECT count(*) FROM users
  verdict: allow
- query: SELECT id, created_at FROM users
  verdict: allow
- query: SELECT u.id, u.created_at FROM users u WHERE u.created_at > '2020-01-01'
  verdict: allow
- query: SELECT max(created_at) FROM users GROUP BY id
  verdict: allow
- query: SELECT * FROM orders
  verdict: allow
- query: SELECT o.* FROM orders o
  verdict: allow
- query: SELECT id, amount FROM orders WHERE amount > 10 ORDER BY amount DESC LIMIT 5
  verdict: allow
- query: SELECT o.id FROM orders o JOIN payments p ON p.order_id = o.id
  verdict: allow
# the wildcard's OWN source has no rules: nothing protected can come back
- query: SELECT * FROM orders WHERE uid IN (SELECT id FROM users)
  verdict: allow
- query: SELECT o.* FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
- query: SELECT count(*) FROM users JOIN dict USING (id)
  verdict: allow
- query: SELECT o.id FROM orders o JOIN payments p USING (order_id)
  verdict: allow
# a qualified prefix that provably names an unruled source (same proof the
# `o.*` rule already uses — the strict rule used to forbid a subset of it)
- query: SELECT o.email FROM orders o JOIN users u ON u.id = o.uid
  verdict: allow
- query: SELECT dict.email FROM dict JOIN users u ON u.id = dict.id
  verdict: allow
# a subquery inside FROM does not belong to the wildcard's source
- query: SELECT * FROM (SELECT id FROM users) t
  verdict: allow
- query: SELECT * FROM orders o JOIN dict d ON d.id = (SELECT id FROM users LIMIT 1)
  verdict: allow
# an ALIAS that happens to spell a protected table name is not that table
- query: SELECT * FROM orders AS users
  verdict: allow
- query: SELECT amount FROM orders AS users
  verdict: allow
- query: SELECT users.amount FROM orders AS users
  verdict: allow
# a derived table's alias is as provable a source as a real table's: its
# columns can only come from its own body, which net A judges separately
- query: SELECT s.email FROM users u JOIN (SELECT id, contact AS email FROM signups) s ON s.id = u.id
  verdict: allow
- query: SELECT x.email FROM (VALUES ('a')) AS x (email), users u
  verdict: allow
- query: SELECT f.email FROM users u, generate_series(1, 3) AS f (email)
  verdict: allow
# a table function is not a named relation, but its ARGUMENTS are still scanned
- query: SELECT * FROM generate_series(1, 3)
  verdict: allow
- query: SELECT 1 FROM users u, unnest(ARRAY[1]) AS g
  verdict: allow
# a column named like a protected one, on a table with no rule at all
- query: SELECT email FROM newsletter_signups
  verdict: allow
# the statistics catalogs stay open when no PII rule is configured
- query: SELECT * FROM pg_stats
  verdict: allow
  pii: none
- query: SELECT * FROM users
  verdict: allow
  pii: none
- query: SELECT email FROM users
  verdict: allow
  pii: none
