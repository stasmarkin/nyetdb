[package]
name = "nyetdb"
version = "0.0.1"
edition = "2021"
description = "Read-only database access for AI agents. Your agent can look; for everything else — nyet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/stasmarkin/nyetdb"
readme = "README.md"
keywords = ["database", "cli", "ai", "agent", "read-only"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "nyet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = { version = "0.62", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "time"] }
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
