# cargo-deny config: supply chain gates (D8). CI fails on violations.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Closed allowlist; extend consciously per new dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Added with the rustls TLS backend (sqlx `tls-rustls-ring-webpki`);
    # ubiquitous permissive code licenses, kept global:
    "ISC",          # ring (Apache-2.0 AND ISC), rustls-webpki
    "BSD-3-Clause", # subtle (constant-time crypto, via rustls)
]

# Scoped, not global: only this crate may be Zlib.
[[licenses.exceptions]]
name = "foldhash" # via hashbrown, via sqlx
allow = ["Zlib"]

# Scoped: only the bundled Mozilla CA data set (via sqlx's rustls webpki roots)
# carries CDLA-Permissive-2.0 — a data license, not a general code license, so
# it stays confined to this one crate rather than the global allowlist.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Scoped: the SHA-3/Keccak implementation the MongoDB driver's SCRAM auth
# reaches through its hash stack. CC0-1.0 is a public-domain DEDICATION (no
# conditions to satisfy, no attribution to carry) rather than a permissive code
# license, so it stays confined to this one crate instead of joining the global
# allowlist — a future dependency that arrives under CC0 must be a conscious
# decision of its own.
[[licenses.exceptions]]
name = "tiny-keccak" # via mongodb
allow = ["CC0-1.0"]

# Scoped: the xxHash implementation redis-rs uses for its client-side cache key
# hashing. BSL-1.0 is the Boost Software License — permissive and OSI-approved,
# with the unusual property that binary redistribution needs no notice at all —
# but it is rare enough that it stays confined to this one crate rather than
# joining the global allowlist.
[[licenses.exceptions]]
name = "xxhash-rust" # via redis
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
