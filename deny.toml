# cargo-deny config: supply chain gates (Д8). CI fails on violations.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Closed allowlist; extend consciously per new dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Added with the rustls TLS backend (sqlx `tls-rustls-ring-webpki`);
    # ubiquitous permissive code licenses, kept global:
    "ISC",          # ring (Apache-2.0 AND ISC), rustls-webpki
    "BSD-3-Clause", # subtle (constant-time crypto, via rustls)
]

# Scoped, not global: only this crate may be Zlib.
[[licenses.exceptions]]
name = "foldhash" # via hashbrown, via sqlx
allow = ["Zlib"]

# Scoped: only the bundled Mozilla CA data set (via sqlx's rustls webpki roots)
# carries CDLA-Permissive-2.0 — a data license, not a general code license, so
# it stays confined to this one crate rather than the global allowlist.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
